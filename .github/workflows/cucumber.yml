name: Cucumber

on:
  pull_request:
  schedule:
    # 07:00 Asia/Kolkata (IST, UTC+5:30). GitHub cron is UTC.
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      tags:
        description: Cucumber tag expression
        required: false
        default: "@smoke"
        type: string
      application_url:
        description: Application sign-in URL (sets PB_URL for this run)
        required: true
        default: "https://test.pbweb.info/MicrosoftIdentity/Account/SignIn"
        type: string

concurrency:
  group: cucumber-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PB_URL: ${{ secrets.PB_URL }}
      PB_BROWSER: Chrome
      PB_PASSWORD: ${{ secrets.PB_PASSWORD }}
      PB_OPERATOR_USERNAME: ${{ secrets.PB_OPERATOR_USERNAME }}
      PB_GUEST_USERNAME: ${{ secrets.PB_GUEST_USERNAME }}
      PB_ADMIN_USERNAME: ${{ secrets.PB_ADMIN_USERNAME }}
      PB_INVALID_USERNAME: ${{ secrets.PB_INVALID_USERNAME }}
      PB_STAGE_URL: ${{ secrets.PB_STAGE_URL }}
      PB_STAGE_OPERATOR_USERNAME: ${{ secrets.PB_STAGE_OPERATOR_USERNAME }}
      PB_STAGE_GUEST_USERNAME: ${{ secrets.PB_STAGE_GUEST_USERNAME }}
      PB_STAGE_ADMIN_USERNAME: ${{ secrets.PB_STAGE_ADMIN_USERNAME }}
      PB_STAGE_INVALID_USERNAME: ${{ secrets.PB_STAGE_INVALID_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run smoke tests
        if: github.event_name == 'pull_request'
        run: mvn -B test -Psmoke -Dheadless=true

      - name: Run daily regression
        if: github.event_name == 'schedule'
        run: mvn -B test -Pregression -Dheadless=true

      - name: Run selected tags
        if: github.event_name == 'workflow_dispatch'
        env:
          PB_URL: ${{ inputs.application_url }}
        run: mvn -B test -Dheadless=true -Dcucumber.tags="${{ inputs.tags }}"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn

      - name: Generate Allure report
        if: success() || failure()
        run: mvn -B allure:report

      - name: Upload Allure report
        id: allure-report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          if-no-files-found: warn

      - name: Notify Google Chat
        if: success() || failure()
        continue-on-error: true
        env:
          GOOGLE_CHAT_SPACE: ${{ secrets.GOOGLE_CHAT_SPACE }}
          GOOGLE_CHAT_CREDENTIALS: ${{ secrets.GOOGLE_CHAT_CREDENTIALS }}
          GOOGLE_CHAT_USER: ${{ secrets.GOOGLE_CHAT_USER }}
          ALLURE_RESULTS: target/allure-results
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.allure-report.outputs.artifact-id }}
          SUITE_NAME: Cucumber
          RUN_EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$GOOGLE_CHAT_SPACE" ] || [ -z "$GOOGLE_CHAT_CREDENTIALS" ]; then
            echo "Google Chat secrets are not set. Skipping notification."
            python3 scripts/notify_google_chat.py
            exit 0
          fi
          python3 -m pip install --quiet google-auth requests
          python3 scripts/notify_google_chat.py
