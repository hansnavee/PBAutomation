name: Cucumber

on:
  pull_request:
  schedule:
    # 07:00 Asia/Kolkata (IST, UTC+5:30). GitHub cron is UTC.
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      tags:
        description: Cucumber tag expression
        required: false
        default: "@smoke"
        type: string
      application_url:
        description: Application sign-in URL (sets PB_URL for this run)
        required: true
        default: "https://test.pbweb.info/MicrosoftIdentity/Account/SignIn"
        type: string

concurrency:
  group: cucumber-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PB_URL: ${{ secrets.PB_URL }}
      PB_BROWSER: Chrome
      PB_OPERATOR_USERNAME: ${{ secrets.PB_OPERATOR_USERNAME }}
      PB_OPERATOR_PASSWORD: ${{ secrets.PB_OPERATOR_PASSWORD }}
      PB_GUEST_USERNAME: ${{ secrets.PB_GUEST_USERNAME }}
      PB_GUEST_PASSWORD: ${{ secrets.PB_GUEST_PASSWORD }}
      PB_ADMIN_USERNAME: ${{ secrets.PB_ADMIN_USERNAME }}
      PB_ADMIN_PASSWORD: ${{ secrets.PB_ADMIN_PASSWORD }}
      PB_INVALID_USERNAME: ${{ secrets.PB_INVALID_USERNAME }}
      PB_INVALID_PASSWORD: ${{ secrets.PB_INVALID_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run smoke tests
        if: github.event_name == 'pull_request'
        run: mvn -B test -Psmoke -Dheadless=true

      - name: Run daily regression
        if: github.event_name == 'schedule'
        run: mvn -B test -Pregression -Dheadless=true

      - name: Run selected tags
        if: github.event_name == 'workflow_dispatch'
        env:
          PB_URL: ${{ inputs.application_url }}
        run: mvn -B test -Dheadless=true -Dcucumber.tags="${{ inputs.tags }}"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn

      - name: Generate Allure report
        if: failure() || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: mvn -B allure:report

      - name: Upload Allure report
        if: failure() || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          if-no-files-found: warn
